name: Feature - Provider API

on:
  push:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/ApiClient.java"
      - "src/main/java/com/jarvis/jarvisapk/JarvisSettings.java"
      - "src/main/resources/application.yaml"
  pull_request:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/ApiClient.java"
      - "src/main/java/com/jarvis/jarvisapk/JarvisSettings.java"
      - "src/main/resources/application.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/jarvis-feature-checks.yml
