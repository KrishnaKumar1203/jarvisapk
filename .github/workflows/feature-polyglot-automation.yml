name: Feature - Polyglot automation and reports

on:
  push:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/MultiLanguageTestOrchestrator.java"
      - "src/test/**"
      - "tools/javascript/**"
      - "tools/python/**"
  pull_request:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/MultiLanguageTestOrchestrator.java"
      - "src/test/**"
      - "tools/javascript/**"
      - "tools/python/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/jarvis-feature-checks.yml
