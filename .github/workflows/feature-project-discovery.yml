name: Feature - Project discovery

on:
  push:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/WorkspaceProjectCatalog.java"
      - "workspace-projects.yaml"
      - "README.md"
  pull_request:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/WorkspaceProjectCatalog.java"
      - "workspace-projects.yaml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/jarvis-feature-checks.yml
