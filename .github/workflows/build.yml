name: Build Jarvis

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/javascript/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JavaScript automation dependencies
        run: npm ci --prefix tools/javascript
      - name: Install Python OCR dependencies
        run: python -m pip install -r tools/python/requirements.txt
      - name: Verify build and tests
        run: mvn --batch-mode --no-transfer-progress --settings .mvn/settings.xml -T 1C verify
      - name: Test JavaScript API client
        run: npm test --prefix tools/javascript
      - name: Test Playwright API contract
        run: npm run test:e2e --prefix tools/javascript
      - name: Test Python OCR bridge validation
        run: python -m unittest discover -s tools/python/tests -v
