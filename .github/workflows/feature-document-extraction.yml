name: Feature - Document and OCR extraction

on:
  push:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/DocumentReaderService.java"
      - "src/main/java/com/jarvis/jarvisapk/PythonVisionExecutor.java"
      - "src/main/resources/application.yaml"
      - "tools/python/**"
  pull_request:
    paths:
      - "src/main/java/com/jarvis/jarvisapk/DocumentReaderService.java"
      - "src/main/java/com/jarvis/jarvisapk/PythonVisionExecutor.java"
      - "src/main/resources/application.yaml"
      - "tools/python/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/jarvis-feature-checks.yml
