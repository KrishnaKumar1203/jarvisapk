version: 1
process:
  timeout-seconds: 900
  max-captured-output-bytes: 1048576
  report-directory: reports/automation
suites:
  java:
    command: [mvn, --batch-mode, --no-transfer-progress, --settings, .mvn/settings.xml, verify]
    working-directory: .
  javascript-unit:
    command: [npm, --prefix, tools/javascript, test]
    working-directory: .
  playwright:
    command: [npm, --prefix, tools/javascript, run, test:e2e]
    working-directory: .
  python:
    command: [python, -m, unittest, discover, -s, tools/python/tests, -v]
    working-directory: .
